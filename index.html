<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAHI BABE❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Pirata+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070003;--card:#150209;--ink:#ffe3e3;--red:#ff1744;--ember:#ff6d00;--gold:#ffc46b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Poppins,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% -10%,#5c0014 0,var(--bg) 55%) fixed}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to top,#ff1744aa,#ff6d0033,transparent);pointer-events:none;animation:glow 2.5s ease-in-out infinite alternate;z-index:0}
@keyframes glow{to{opacity:.45}}
.ember{position:fixed;bottom:-20px;font-size:18px;opacity:.7;animation:rise linear infinite;pointer-events:none;z-index:0}
@keyframes rise{to{transform:translateY(-110vh) translateX(30px) rotate(40deg);opacity:0}}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px;position:relative;z-index:1}
h1{font-family:'Metal Mania',cursive;font-weight:400;font-size:40px;text-align:center;margin:8px 0 0;color:var(--red);text-shadow:0 0 6px var(--red),0 0 24px #ff174488;animation:flick 3s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.6}96%{opacity:1}98%{opacity:.7}}
.sub{text-align:center;font-family:'Pirata One',cursive;font-size:20px;color:var(--gold);margin:4px 0 18px;letter-spacing:1px}
.horns{text-align:center;font-size:40px;margin:0}
.cat{background:linear-gradient(160deg,#1d0310,var(--card));border:1px solid #6b0f26;border-left:4px solid var(--red);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 0 18px #ff174422}
.cat h2{font-family:'Pirata One',cursive;font-weight:400;font-size:24px;margin:0;color:var(--ember);letter-spacing:1px}
.cat small{color:#d98a96;display:block;margin:0 0 10px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--red);background:#0b0105;color:var(--ink);padding:8px 12px;border-radius:999px;font:600 13px Poppins,sans-serif;cursor:pointer;transition:.15s}
.chip.on{background:linear-gradient(90deg,var(--red),var(--ember));border-color:var(--ember);box-shadow:0 0 14px var(--red);transform:scale(1.04)}
.chip.on::before{content:"😈 "}
textarea{width:100%;background:#0b0105;color:var(--ink);border:1px solid #6b0f26;border-radius:12px;padding:12px;font:14px Poppins,sans-serif}
.task{border:2px dashed var(--ember);border-radius:16px;padding:16px;margin:18px 0;background:#150209;box-shadow:0 0 22px #ff6d0033}
.task h2{font-family:'Pirata One',cursive;font-weight:400;font-size:26px;color:var(--ember);margin:0 0 6px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;margin-top:10px;font:600 16px Poppins,sans-serif;color:#fff;background:linear-gradient(90deg,#b0002a,var(--red),var(--ember));box-shadow:0 0 24px #ff1744aa;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 34px #ff6d00cc}}
.btn.alt{background:transparent;border:1px solid var(--gold);color:var(--gold);box-shadow:none;animation:none}
#status{margin-top:8px;min-height:22px;font-weight:600;text-align:center}
.ok{color:#7dffa8}.no{color:#ffb36b}
.wheelbox{position:relative;width:min(300px,80vw);margin:14px auto}
.wheelbox #wheel{transition:transform 4s cubic-bezier(.12,.7,.1,1);filter:drop-shadow(0 0 16px #ff1744)}
.ptr{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:32px;color:var(--gold);z-index:2;text-shadow:0 0 10px #000}
#wmsg{text-align:center;font-weight:600;min-height:44px;margin:8px 0}
.btn:disabled{opacity:.4;animation:none;cursor:not-allowed}
.qr-box{text-align:center;margin-top:14px;background:#0b0105;border:1px solid var(--ember);border-radius:12px;padding:12px;display:none}
.qr-box img{width:160px;height:160px;border-radius:8px;border:2px solid var(--gold);background:#fff;padding:6px}
</style>
</head>
<body>
<main>
<p class="horns">😈</p>
<h1>MAHI BABE❤️</h1>
<p class="sub">Be naughty. Be greedy. Pick your sins 🔥</p>
<div id="cats"></div>

<div class="cat">
<h2>✍️ Your Own Sin</h2>
<small>Whisper your wish... if you dare 😏</small>
<textarea id="free" rows="3" placeholder="Tell me what your wicked heart wants..."></textarea>
</div>

<div class="task">
<h2>🎰 Wheel of Greed</h2>
<p>Up to 2 spins. Keep what you land on, or spin again for a fresh amount! 😈</p>
<div class="wheelbox"><div class="ptr">▼</div><div id="wheel"></div></div>
<div id="wmsg">Wheel is ready! Spin if you dare 😈</div>
<button class="btn" id="spinBtn">Spin 🎰</button>
<button class="btn alt" id="keepBtn" style="display:none"></button>
<div id="qrBox" class="qr-box">
<p style="margin:0 0 8px;color:var(--gold);font-weight:600">Scan & Pay via UPI 💸</p>
<img id="qrImg" src="" alt="UPI QR Code">
<p style="margin:8px 0 0;font-size:12px;color:#d98a96">UPI ID: mohit01010101@axl</p>
</div>
</div>

<button class="btn" id="send">😈 Send my sins to him</button>
<div id="status"></div>
</main>

<script>
const HER_NAME = "Mahi Babe";
const UPI_ID = "mohit01010101@axl";

const CATS = [
  ["🛒 Blinkit & Instamart","Midnight cravings, delivered in 10",["Chocolates 🍫","Ice cream 🍨","Midnight snacks 🍿","Flowers 💐","Skincare 🧴","Makeup 💄","Cold drinks 🥤","Wine glasses & candles 🍷","Cakes 🎂","Chips & Nachos 🧀"]],
  ["🍕 Zomato & Swiggy","Feed me, mortal",["Candlelight dinner 🕯️","Biryani 🍛","Momos 🥟","Desserts 🍰","Coffee date ☕","Pizza night 🍕","Rolls & shawarma 🌯","Zomato Gold ✨","Chinese Feast 🍜","Burgers 🍔"]],
  ["👗 Clothing & Fashion","Dress me up, then undress the bill 😏",["Dream Dress 👗","Cute Kurti 👚","Gorgeous Saree 🥻","Trendy Sneakers 👟","Designer Handbag 👜","Signature Perfume 🌸","Sparkly Jewellery 💍","Myntra haul 🛍️","Meesho finds 📦","High Heels 👠"]],
  ["💄 Nykaa & Beauty","Look devilish",["Luxury Lipstick 💄","Skincare set ✨","Relaxing Hair spa 💆‍♀️","Nail art session 💅","Full Salon day 💇‍♀️","Body lotion 🧴","Professional Hair tools ⚡","Face Masks 🧖‍♀️"]],
  ["🎬 Netflix & Chill","Don't watch alone",["Movie night 🍿","Series binge marathon 🛋️","Popcorn + tight cuddles 🤗","Netflix premium plan 📺","Prime Video 🎬","Hotstar VIP 🌟","BookMyShow movie tickets 🎟️","Spotify Premium 🎶"]],
  ["📦 Amazon & Flipkart","Cart full, heart fuller",["Secret Surprise Gift 🎁","Tech Gadgets 📱","Bestselling Books 📚","Home decor 🛋️","Wireless Earbuds 🎧","Smartwatch ⌚","Cute Phone cover 📲","Giant Teddy bear 🧸"]],
  ["📱 Recharges & Bills","Keep me online",["Jio Unlimited recharge ⚡","Airtel pack 📶","Vi recharge 🔋","Wi-Fi broadband bill 🛜","Electricity bill 💡","FASTag top-up 🚗"]],
  ["🚗 Rides & Trips","Take me away",["Uber cab ride 🚖","Ola trip 🚙","Rapido bike 🏍️","Late night Long drive 🌃","Romantic Weekend trip 🏖️","Private OYO stay 🏨","Train tickets 🚆","Flight tickets ✈️"]],
  ["💆 Spa, Gym & Health","Pamper the goddess",["Luxurious Spa day 🌿","Full body massage 💆‍♂️","Gym membership 🏋️‍♀️","Yoga classes 🧘‍♀️","Vitamins & supplements 💊"]],
  ["🔥 Sexy Outfits","Dress to tempt me 😈",["Sensual Bra & Panty set 👙","Lace Bralette 🖤","Lingerie set ✨","Babydoll nightwear 🌙","Corset top 💋","Silk robe 🎀","Seductive Stockings 🧦","Swimsuit 🌊"]],
  ["💸 Cash & UPI","Direct hits",["Pocket money 💵","PhonePe transfer 💸","GPay surprise 🧧","Paytm top-up 💳","Shopping Gift card 🛍️"]]
];

const picked = new Set();
const cats = document.getElementById('cats');

CATS.forEach(([title,tag,items])=>{
  const d = document.createElement('div'); d.className='cat';
  d.innerHTML = '<h2>'+title+'</h2><small>'+tag+' (Pick max 2)</small><div class="chips"></div>';
  const box = d.querySelector('.chips');
  items.forEach(it=>{
    const b = document.createElement('button'); b.className='chip'; b.textContent=it;
    b.onclick=()=>{
      const k=title+'|'+it;
      const count = Array.from(picked).filter(x => x.startsWith(title+'|')).length;
      if(picked.has(k)){
        picked.delete(k);
        b.classList.remove('on');
      } else {
        if(count >= 2){
          alert('You can only pick up to 2 items from this category, greedy girl! 😈');
          return;
        }
        picked.add(k);
        b.classList.add('on');
      }
    };
    box.appendChild(b);
  });
  cats.appendChild(d);
});

function buildText(){
  const lines = ['😈 '+HER_NAME+"'s Wish List 😈",''];
  const by = {};
  picked.forEach(k=>{const [c,i]=k.split('|');(by[c]=by[c]||[]).push(i)});
  Object.keys(by).forEach(c=>lines.push(c+': '+by[c].join(', ')));
  const f = document.getElementById('free').value.trim();
  if(f) lines.push('✍️ Own wish: '+f);
  if(!picked.size && !f) lines.push('(nothing picked, only love 😘)');
  lines.push('', 'Spins used: '+spinsUsed+'/2', 'Tip: '+(finalTip===null?'(not claimed yet)':'(₹'+finalTip+' due 💸)'), 'UPI ID: '+UPI_ID);
  return lines.join('\n');
}

const st = document.getElementById('status');
document.getElementById('send').onclick = ()=>{
  const text = buildText();
  st.className='ok'; st.textContent='Opening Telegram... 🔥';
  window.open('https://t.me/share/url?url=&text='+encodeURIComponent(text),'_blank');
};

// WHEEL OF GREED SETUP (Max 2 Spins, Unbiased Random)
const WHEEL=[100,200,300,400,500,600,700,800,900,1000];
let finalTip=null, spinsUsed=0, spinning=false, rot=0;
const rand=a=>a[Math.floor(Math.random()*a.length)];
const wl=document.getElementById('wheel'), wmsg=document.getElementById('wmsg'), spinBtn=document.getElementById('spinBtn'), keepBtn=document.getElementById('keepBtn'), qrBox=document.getElementById('qrBox'), qrImg=document.getElementById('qrImg');

(function(){
  let s='';
  WHEEL.forEach((v,i)=>{
    const a0=(i*36-90)*Math.PI/180, a1=((i+1)*36-90)*Math.PI/180;
    const x0=150+150*Math.cos(a0), y0=150+150*Math.sin(a0), x1=150+150*Math.cos(a1), y1=150+150*Math.sin(a1);
    s+='<path d="M150 150 L'+x0+' '+y0+' A150 150 0 0 1 '+x1+' '+y1+' Z" fill="'+(i%2?'#7a0019':'#d50032')+'" stroke="#ffc46b" stroke-width="2"/>';
    s+='<text x="150" y="50" transform="rotate('+(i*36+18)+' 150 150)" text-anchor="middle" fill="#fff" font-size="19" font-weight="700" font-family="Poppins,sans-serif">₹'+v+'</text>';
  });
  wl.innerHTML='<svg viewBox="0 0 300 300" width="100%">'+s+'<circle cx="150" cy="150" r="16" fill="#150209" stroke="#ffc46b" stroke-width="3"/></svg>';
})();

spinBtn.onclick=()=>{
  if(spinning||finalTip!==null||spinsUsed>=2) return;
  spinning=true; spinBtn.disabled=true; keepBtn.style.display='none';
  spinsUsed++;
  const t=rand(WHEEL), i=WHEEL.indexOf(t);
  const fa=(360-(i*36+18)+(Math.random()-.5)*20+360)%360;
  rot+=360*5+((fa-(rot%360))+360)%360;
  wl.style.transform='rotate('+rot+'deg)';
  wmsg.textContent='Spinning... 🔥';
  setTimeout(()=>{ spinning=false; showResult(t); },4200);
};

function showQR(amt){
  const upiUri = `upi://pay?pa=${UPI_ID}&pn=MahiBabe&am=${amt}&cu=INR`;
  qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUri)}`;
  qrBox.style.display='block';
}

function showResult(t){
  if(spinsUsed<2){
    wmsg.textContent='You landed on ₹'+t+' 😈 Keep it, or spin one last time?';
    keepBtn.textContent='Keep ₹'+t+' 💸'; keepBtn.style.display='block';
    spinBtn.textContent='Spin 2nd Time 😈'; spinBtn.disabled=false;
    keepBtn.onclick=()=>{
      finalTip=t;
      keepBtn.style.display='none';
      spinBtn.style.display='none';
      wmsg.className='ok';
      wmsg.textContent='Smart girl! ₹'+t+' tip is locked 💸';
      showQR(t);
    };
  } else {
    keepBtn.style.display='none';
    spinBtn.style.display='none';
    finalTip=t;
    wmsg.className='ok';
    wmsg.textContent='Final Prize: ₹'+t+' tip secured! 🎉😈';
    showQR(t);
  }
}

for(let i=0;i<16;i++){
  const h=document.createElement('div');h.className='ember';h.textContent=['🔥','😈','💋','✨'][i%4];
  h.style.left=Math.random()*100+'vw';h.style.animationDuration=(7+Math.random()*9)+'s';h.style.animationDelay=(-Math.random()*10)+'s';
  document.body.appendChild(h);
}
</script>
</body>
</html>
